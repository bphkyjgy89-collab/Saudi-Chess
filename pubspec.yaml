name: saudi_chess
description: "Saudi Chess - تطبيق شطرنج بالعربي، العب ضد الكمبيوتر أو مع صديق على نفس الجهاز"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # لوحة الشطرنج + منطق اللعبة (قواعد، كش ملك، تعادل...)
  flutter_chess_board: ^1.0.1
  chess: ^0.7.0

  # محرك Stockfish للعب ضد الكمبيوتر
  stockfish: ^1.8.1

  # خطوط عربية جميلة
  google_fonts: ^6.2.1

  # حفظ الإعدادات والنتائج محلياً (زي Khat Bat)
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
